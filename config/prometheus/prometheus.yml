---
# =============================================================================
# Prometheus Configuration
# Scrapes Blackbox Exporter probes for all monitored targets
# =============================================================================

global:
  scrape_interval: 60s          # How often to probe targets
  evaluation_interval: 30s      # How often to evaluate alert rules
  scrape_timeout: 30s           # Probe timeout (must be < scrape_interval)

  external_labels:
    monitor: "external-monitoring"
    environment: "production"

# Alert rules file
rule_files:
  - /etc/prometheus/rules.yml

# Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

scrape_configs:

  # ---------------------------------------------------------------------------
  # Self-monitoring: Prometheus itself
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------------
  # Self-monitoring: Blackbox Exporter
  # ---------------------------------------------------------------------------
  - job_name: "blackbox_exporter"
    static_configs:
      - targets: ["blackbox:9115"]

  # ---------------------------------------------------------------------------
  # PUBLIC WEBSITES — HTTP 2xx availability check
  # Probes: status code 2xx, latency, TLS
  # ---------------------------------------------------------------------------
  - job_name: "blackbox_http_websites"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.google.com
          - https://www.github.com
          - https://www.cloudflare.com
          - https://httpbin.org
        labels:
          check_type: "website"
          environment: "public"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---------------------------------------------------------------------------
  # PUBLIC APIs — JSON API check
  # Validates: status 200, non-empty JSON body, latency
  # ---------------------------------------------------------------------------
  - job_name: "blackbox_http_apis"
    metrics_path: /probe
    params:
      module: [http_json_api]
    static_configs:
      - targets:
          - https://api.github.com
          - https://httpbin.org/get
          - https://jsonplaceholder.typicode.com/posts/1
          - https://api.publicapis.org/entries
        labels:
          check_type: "api"
          environment: "public"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---------------------------------------------------------------------------
  # TLS CERTIFICATE EXPIRY — checks SSL/TLS cert validity
  # Alert fires if cert expires in < 14 days
  # ---------------------------------------------------------------------------
  - job_name: "blackbox_tls_expiry"
    metrics_path: /probe
    params:
      module: [http_tls_expiry]
    static_configs:
      - targets:
          - https://www.google.com
          - https://www.github.com
          - https://www.cloudflare.com
          - https://expired.badssl.com    # Demo: already expired cert
        labels:
          check_type: "tls"
          environment: "public"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---------------------------------------------------------------------------
  # BODY CONTENT CHECK — validates specific content in response body
  # ---------------------------------------------------------------------------
  - job_name: "blackbox_http_body"
    metrics_path: /probe
    params:
      module: [http_check_body]
    static_configs:
      - targets:
          - https://example.com
        labels:
          check_type: "body"
          expected_content: "Example Domain"
          environment: "public"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---------------------------------------------------------------------------
  # LATENCY / TIMEOUT CHECK — probes with strict timeout threshold
  # (Alert fires if probe_duration_seconds > threshold defined in rules)
  # ---------------------------------------------------------------------------
  - job_name: "blackbox_latency"
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets:
          - https://www.google.com
          - https://httpbin.org/delay/0
        labels:
          check_type: "latency"
          environment: "public"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---------------------------------------------------------------------------
  # INTENTIONALLY BROKEN — always fails to test alerting pipeline
  # Sends alert immediately after 2 consecutive failures (for demo/test)
  # ---------------------------------------------------------------------------
  - job_name: "blackbox_broken_demo"
    metrics_path: /probe
    params:
      module: [http_broken]
    scrape_interval: 30s
    static_configs:
      - targets:
          - https://httpbin.org/status/200   # Real site, but wrong expected code
        labels:
          check_type: "demo_broken"
          environment: "demo"
          purpose: "alert_testing"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
