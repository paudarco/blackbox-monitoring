# ---------------------------------------------------------------------------
# Пример 7: Намеренно сломанная проверка (для тестирования алертов)
# ---------------------------------------------------------------------------
example_broken_check_for_testing:
  # В blackbox.yml уже есть модуль http_broken.
  # Добавьте любой реальный URL:
  job_name: "blackbox_broken_test"
  metrics_path: /probe
  params:
    module: [http_broken]   # Ожидает статус 999, которого не существует
  static_configs:
    - targets:
        - https://httpbin.org/status/200
      labels:
        check_type: "demo_broken"
        purpose: "alert_testing"
